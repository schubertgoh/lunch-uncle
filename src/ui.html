<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lunch Uncle</title>
  <style>
    :root { --uncle: #fde68a; --you: #dbeafe; --ink: #1f2937; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, sans-serif; color: var(--ink);
      background: #f9fafb; display: flex; flex-direction: column; height: 100vh;
    }
    header { padding: 1rem; background: #fff; border-bottom: 1px solid #e5e7eb; }
    header h1 { margin: 0; font-size: 1.25rem; }
    header p { margin: .25rem 0 0; color: #6b7280; font-size: .875rem; }
    #chat { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: .5rem; }
    .bubble {
      max-width: 75%; padding: .6rem .9rem; border-radius: 1rem; line-height: 1.4;
      white-space: pre-wrap; word-wrap: break-word;
    }
    .uncle { background: var(--uncle); align-self: flex-start; border-bottom-left-radius: .25rem; }
    .you { background: var(--you); align-self: flex-end; border-bottom-right-radius: .25rem; }
    form { display: flex; gap: .5rem; padding: 1rem; background: #fff; border-top: 1px solid #e5e7eb; }
    input { flex: 1; padding: .6rem .9rem; font-size: 1rem; border: 1px solid #d1d5db; border-radius: .5rem; }
    button { padding: .6rem 1.2rem; font-size: 1rem; border: 0; border-radius: .5rem; background: var(--ink); color: #fff; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <header>
    <h1>Lunch Uncle</h1>
    <p>Tell Uncle what you feel like eating. <span id="where">Finding where you are...</span></p>
  </header>

  <div id="chat"></div>

  <form id="form">
    <input id="input" placeholder="Uncle, where to eat?" autocomplete="off" autofocus>
    <button id="send" type="submit">Send</button>
  </form>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");

    const where = document.getElementById("where");

    // Conversation so far, in the shape the /chat endpoint expects.
    const history = [];

    // The user's position, if they allow it. Without it the server falls
    // back to CT Hub 2.
    let userLocation = null;
    if ("geolocation" in navigator) {
      navigator.geolocation.getCurrentPosition(
        ({ coords }) => {
          userLocation = { latitude: coords.latitude, longitude: coords.longitude };
          where.textContent = "Uncle is using your location.";
        },
        () => {
          where.textContent = "Location off, so Uncle assumes CT Hub 2, Lavender.";
        },
        { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 },
      );
    } else {
      where.textContent = "Uncle assumes you are at CT Hub 2, Lavender.";
    }

    function addBubble(role, text) {
      const div = document.createElement("div");
      div.className = `bubble ${role === "user" ? "you" : "uncle"}`;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      input.value = "";
      send.disabled = true;
      addBubble("user", message);
      const thinking = addBubble("assistant", "Uncle thinking...");

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ history, message, location: userLocation }),
        });
        const data = await res.json();
        if (!res.ok || typeof data.reply !== "string") {
          // Show the error, but keep it out of history so the model never
          // sees it as something Uncle said.
          thinking.textContent = data.error ?? "No reply.";
          return;
        }
        thinking.textContent = data.reply;
        history.push({ role: "user", content: message });
        history.push({ role: "assistant", content: data.reply });
      } catch (err) {
        thinking.textContent = "Cannot reach Uncle. Try again.";
      } finally {
        send.disabled = false;
        input.focus();
      }
    });

    addBubble("assistant", "Eh, what you want to eat? Don't waste my time.");
  </script>
</body>
</html>
